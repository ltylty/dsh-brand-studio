packages:
  - .

# Dependency installation policy.
autoInstallPeers: false
blockExoticSubdeps: true
ignoreScripts: true
minimumReleaseAge: 2880
strictDepBuilds: true
trustPolicy: no-downgrade

# Use a provenance-bearing release of Node's fetch API declarations.
overrides:
  '@types/node>undici-types': 6.29.0

# Exact releases approved for the DSH 0.2.2-rc.1 development update.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.1.0'
  - '@deepseek-ai/cosmokit@1.9.0'
  - '@deepseek-ai/schemastery@3.19.0'
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-store@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-sidebar@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.1'
